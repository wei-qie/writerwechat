name: 基市红绿灯_美股收盘

on:
  schedule:
    - cron: '0 21 * * 1-5'   # 05:00 CST (21:00 UTC, 次日北京时间)
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate article
        run: python -m auto_pilot.main us_close

      - name: Upload article
        uses: actions/upload-artifact@v4
        with:
          name: us_close-${{ github.run_id }}
          path: output/
          retention-days: 7
